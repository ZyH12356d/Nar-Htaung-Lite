<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101514" />
    <title>Nar Htaung Lite</title>
    <base href="/" />
    <script>
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f5f6ef' : '#101514';
            localStorage.setItem('theme', theme);
        }
        try { setTheme(localStorage.getItem('theme') || 'dark'); } catch {}
    </script>
    <link rel="stylesheet" href="app.css" />
    <link rel="preload" as="image" href="logo/nar-htaung.png" />
    <link rel="icon" type="image/png" href="logo/nar-htaung.png" />
</head>
<body>
    <div id="app">
        <section class="startup-screen" role="status" aria-live="polite" aria-label="Opening Nar Htaung Lite">
            <div class="startup-content">
                <img class="startup-logo" src="logo/nar-htaung.png" width="144" height="144" alt="" fetchpriority="high" />
                <h1>Nar Htaung<span> LITE</span></h1>
                <p class="startup-tagline">Your music. Always with you.</p>
                <div class="startup-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
                <p class="startup-status">Opening your music…</p>
            </div>
            <p class="startup-footer">YOUR OFFLINE SOUNDTRACK</p>
        </section>
    </div>
    <div id="blazor-error-ui" data-nosnippet>Something interrupted the app.<a href="." class="reload">Reload</a><span class="dismiss" aria-label="Dismiss">×</span></div>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
